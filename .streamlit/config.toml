# NetraVerse dashboard theme - graphite SOC console (design.md). No default Streamlit blue.
[server]
headless = true
runOnSave = false
# Streamlit defaults both values to 200 MB. Keep large forensic captures usable
# while retaining an explicit operational ceiling instead of truncating uploads.
maxUploadSize = 4096
maxMessageSize = 4096

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#2A7F7E"
backgroundColor = "#14161A"
secondaryBackgroundColor = "#20242B"
textColor = "#E6E6E6"
borderColor = "#2C313A"
linkColor = "#3B9C9B"
font = "sans-serif"
codeFont = "monospace"
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
redColor = "#C0472C"
orangeColor = "#C98A2C"
yellowColor = "#C98A2C"
greenColor = "#4B8A5E"
blueColor = "#3B9C9B"
violetColor = "#8A9098"
grayColor = "#8A9098"
chartCategoricalColors = ["#3B9C9B", "#8A9098", "#C98A2C", "#C0472C", "#4B8A5E", "#6B7280"]
dataframeHeaderBackgroundColor = "#20242B"
dataframeBorderColor = "#2C313A"

[theme.sidebar]
backgroundColor = "#1B1E23"
secondaryBackgroundColor = "#20242B"
