[project]
name = "netraverse"
version = "2.0.0"
description = "World-model network attack forecasting (SIH 2026, PS 26153)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["src*", "dashboard*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
