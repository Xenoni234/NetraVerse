# Phase 6 controlled augmentation run. Real validation/test sequences remain unchanged.
seed: 1337
output: models/wm_phase6
pretrained_encoder: data/interim/phase6_synthetic/encoder_masked.pt
synthetic_sequence: data/interim/phase6_synthetic_long/train.npz
synthetic_fraction: 0.25
episode_balanced: true
sequence_prefix: data/processed/repaired
sequence_paths:
  train: data/processed/long_horizon/train.npz
  val: data/processed/long_horizon/val.npz
  test: data/processed/long_horizon/test.npz
horizons: [1, 2, 4, 8, 16, 30, 60]
near_horizons: [1, 2, 4, 8]
direct_horizons: [16, 30, 60]
window_cache: data/processed/windows_repaired_cicids2017_v2.parquet
batch_size: 256
cpu_threads: 4
lr: 0.0003
epochs: 10
pretrain_epochs: 3
patience: 3
hidden_size: 128
pos_weight: 10
candidates:
  - {name: phase6_baseline, residual_state: false, temporal_deltas: false, cumulative_risk: false, state_weight: 1.0}
  - {name: phase6_residual, residual_state: true, temporal_deltas: true, cumulative_risk: false, state_weight: 0.2}
  - {name: phase6_cumulative, residual_state: true, temporal_deltas: true, cumulative_risk: true, state_weight: 0.2}
