# configs/eval.yaml
# ---------------------------------------------------------------------------
# EVALUATION CONFIG.
# Points at a trained checkpoint and produces the numbers in DESIGN.md section 6:
# F1 / PR-AUC per horizon, lead-time distribution, FPR, stage macro-F1, plus the
# baseline and ablation comparison tables.
#
# The test split is touched ONCE. If you find yourself re-running this while
# tuning, you are tuning on test — use eval.split=val instead.
# ---------------------------------------------------------------------------

name: eval_full
seed: 1337
device: auto

checkpoint: models/best.ckpt      # overridable: scripts/evaluate.py --checkpoint ...

paths:
  data_root: null
  processed_dir: null
  models_dir: null
  reports_dir: null

data:
  datasets: [cicids2018, cicids2017, cic_iot2023, ctu13, unsw_nb15]
  campaigns: null
  entity_granularity: src_ip
  cache_parquet: true

# ---- LOCKED: must match the training config the checkpoint came from ----
windowing:
  window_seconds: 30
  stride_seconds: 30             # disjoint 30s windows (research docs; K=1,2,4 -> 30/60/120s)
  history_length: 10
  horizons: [1, 2, 4]
  min_windows_per_entity: 14
  drop_incomplete: true

labelling:
  pre_attack_horizon: 6
  n_stages: 6

features:
  use_packet_features: true
  use_baselines: true
  use_trajectory: true
  scaler: robust                  # scaler STATE is loaded from the checkpoint, not refit

splits:
  strategy: chronological
  train_frac: 0.60
  val_frac: 0.20
  test_frac: 0.20
  keep_campaigns_together: true
  held_out_family: Infiltration
  gap_windows: 14

eval:
  split: test                     # test | val — use val while iterating
  batch_size: 512
  horizons: [1, 2, 4]
  threshold: null                 # null -> load from checkpoint, else pick on val
  sustain_windows: 2
  metrics:
    - f1
    - precision
    - recall
    - pr_auc
    - roc_auc
    - fpr
    - lead_time
    - stage_macro_f1
    - state_mse
  lead_time:
    unit: seconds
    report_percentiles: [25, 50, 75]
  report_by:
    - horizon
    - dataset
    - attack_family
    - held_out_family

uncertainty:
  mc_dropout_samples: 20
  confidence_interval: 0.90

explain:
  enabled: true
  shap_background_size: 200
  shap_n_samples: 500
  top_k_features: 5               # how many features a sentence mentions
  target_head: risk

# The three required test conditions — CLAUDE.md section 9.
test_conditions:
  - known_attacks       # chronological test split
  - held_out_family     # train excludes one family entirely
  - cross_dataset       # train on cicids2018, test on unsw_nb15

cross_dataset:
  train_on: cicids2018
  test_on: unsw_nb15

baselines:
  # Persistence is MANDATORY in every results table — CLAUDE.md rule 2.
  - persistence
  - logistic_regression

ablations:
  # The exact required rows — CLAUDE.md section 9.
  - encoder_only                  # decoder disabled: proves forecasting adds value
  - flow_only                     # no packet features
  - shuffled_time                 # ordered vs shuffled history; must collapse

output:
  report_dir: null                # null -> paths.REPORTS_DIR / name
  save_predictions: true
  save_plots: true
  plot_formats: [png, svg]

logging:
  level: INFO
