[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26153-world-model"
version = "0.1.0"
description = "AI-based Network Attack Forecasting via a sequential World Model (SIH 2026, PS SIH26153)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team Netraverse" }]
keywords = ["network-security", "attack-forecasting", "world-model", "mitre-attack", "lstm"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "torch>=2.0",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
demo = ["streamlit>=1.30", "fastapi>=0.110", "uvicorn[standard]>=0.27", "matplotlib>=3.8", "seaborn>=0.13"]
explain = ["shap>=0.44"]
pcap = ["pyshark>=0.6", "scapy>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "jupyter>=1.0", "ipykernel>=6.29"]

[project.scripts]
wm-train = "scripts.train:main"
wm-evaluate = "scripts.evaluate:main"
wm-extract-features = "scripts.extract_features:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
