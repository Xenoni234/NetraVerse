# configs/dev.yaml
# ---------------------------------------------------------------------------
# FAST DEVELOPMENT CONFIG.
# One capture day, a tiny model, two epochs. The point is to exercise every
# code path end-to-end in a couple of minutes on a CPU laptop, NOT to produce
# a number anyone should quote. Use configs/train.yaml for real runs.
#
# Loaded by src/utils config helpers via OmegaConf; every key is overridable
# on the CLI, e.g.  python scripts/train.py --config configs/dev.yaml training.epochs=1
# ---------------------------------------------------------------------------

name: dev
seed: 1337
device: auto            # auto | cpu | cuda   (auto -> cuda if available, else cpu)

paths:
  # Leave null to fall back to the constants in src/data/paths.py.
  data_root: null
  raw_dir: null
  processed_dir: null
  models_dir: null
  reports_dir: null

data:
  datasets: [cicids2017]          # dev: a single source
  campaigns: [cicids2017-tuesday] # dev: a single capture day
  entity_granularity: src_ip      # src_ip | src_dst_pair
  max_rows_per_file: 200000       # hard cap so dev never blows up memory
  cache_parquet: true

# ---- LOCKED in DESIGN.md section 3. Do not tune these per-config. ----
windowing:
  window_seconds: 30
  stride_seconds: 30             # disjoint 30s windows (research docs; K=1,2,4 -> 30/60/120s)
  history_length: 10              # L
  horizons: [1, 2, 4]             # K
  min_windows_per_entity: 14      # L + max(K)
  drop_incomplete: true

labelling:
  pre_attack_horizon: 6           # strides counted as "pre-attack" (60 s)
  n_stages: 6                     # BENIGN + 5 ATT&CK stages

features:
  use_packet_features: false      # dev: skip TShark, flow features only
  use_baselines: true
  use_trajectory: true
  scaler: robust                  # robust | standard | none
  baseline_window_minutes: 30
  peer_group_key: subnet_24

model:
  arch: lstm_encoder_decoder
  input_size: 31                  # PENDING CLAUDE.md 10-B (spec says 45; 31 enumerated)
  hidden_size: 64                 # dev: small
  num_layers: 1
  dropout: 0.1
  bidirectional_encoder: false
  heads:
    state: true
    risk: true
    stage: true

training:
  epochs: 2
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-5
  grad_clip: 1.0
  num_workers: 0                  # 0 on Windows avoids spawn overhead
  early_stopping_patience: 2
  loss_weights:
    state: 1.0
    risk: 2.0
    stage: 1.0
  class_weighting: balanced       # balanced | none | manual
  scheduled_sampling:
    enabled: true
    schedule: linear              # linear | inverse_sigmoid | exponential
    start_prob: 0.0               # P(use own prediction) at epoch 0
    end_prob: 0.5
    warmup_epochs: 0

checkpointing:
  save_dir: null                  # null -> paths.MODELS_DIR / name
  monitor: val/risk_f1_k1
  mode: max
  save_top_k: 1
  save_last: true

eval:
  horizons: [1, 2, 4]
  threshold: 0.5                  # null -> pick on val by best F1
  sustain_windows: 2              # consecutive windows over threshold to alert
  mc_dropout_samples: 0           # dev: skip MC-dropout

logging:
  level: INFO
  log_every_n_steps: 20
  tensorboard: false

# ---- Flow-level LR baseline (scripts/train_baseline_lr.py) ----------------
# Pipeline smoke test + classical-ML DETECTION bar. NOT the forecasting
# baseline: lead time is structurally 0 for a completed-flow classifier.
baseline_lr:
  days: [wed-14-02, thu-15-02, fri-02-03]   # brute force / DoS / Bot
  max_rows_per_day: 400000                  # dev cap; null = all rows
  drop_dst_port: true                       # near-label in CIC-IDS2018
  C: 1.0
  max_iter: 2000
  class_weight: balanced
  threshold: null                           # null -> selected on val by F1
  results_path: results/lr_baseline.json
